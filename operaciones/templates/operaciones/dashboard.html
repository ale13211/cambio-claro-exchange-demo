<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambio Claro</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main><p class="brand">CAMBIO CLARO · DJANGO</p><h1>Operá con precisión.</h1><p class="sub">Calculadora demostrativa respaldada por una vista Django.</p><section><label>Operación<select id="operacion"><option value="buy">Comprar USD</option><option value="sell">Vender USD</option></select></label><label>Monto USD<input id="monto" type="number" value="100" min="0"></label><button id="calcular">Calcular</button><p id="resultado">Seleccioná una operación.</p></section><aside><h2>Cotizaciones de referencia</h2><p>USD · Compra ₲ 7.350 · Venta ₲ 7.300</p><p>BRL · Compra ₲ 1.320 · Venta ₲ 1.390</p></aside></main><script>const b=document.querySelector("#calcular"),r=document.querySelector("#resultado");b.onclick=async()=>{const q=new URLSearchParams({monto:monto.value,operacion:operacion.value});const data=await fetch("/cotizar/?"+q);const json=await data.json();r.textContent=json.error||"Resultado: ₲ "+Number(json.guaranies).toLocaleString("es-PY")+" (tasa "+json.tasa+")"}</script></body></html>
